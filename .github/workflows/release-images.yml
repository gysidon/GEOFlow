name: Release Images

# 可选的备用构建链路。日常发版用 deploy-scripts/release-tag.sh 打 tag，
# 由阿里云 ACR 内置规则自动构建——本 workflow 只在需要多架构
# （amd64 + arm64）或想在 GitHub 上查看构建日志时启用。
#
# 触发方式刻意限定为手动：ACR 内置规则用 release-v$version 生成纯版本号 tag，
# 本 workflow 用「版本号-短 commit」格式，两者同时自动跑会产生两套 tag 混淆。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（留空则取 version.json + 短 commit）'
        required: false
        type: string
      platforms:
        description: '目标架构，逗号分隔'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

env:
  REGISTRY: registry.cn-chengdu.aliyuncs.com
  NS: kintreda
  REPO_APP: geoflow-app
  REPO_WEB: geoflow-web

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 登录阿里云镜像仓库
        if: ${{ secrets.ACR_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 解析镜像版本号
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            base=$(python3 -c "import json;print(json.load(open('version.json'))['version'])" 2>/dev/null || echo unknown)
            short=$(git rev-parse --short HEAD)
            version="${base}-${short}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "镜像版本: ${version}"

      - name: 构建并推送 app 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NS }}/${{ env.REPO_APP }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NS }}/${{ env.REPO_APP }}:latest
          build-args: |
            COMPOSER_IMAGE=composer:2
            PHP_FPM_IMAGE=php:8.4-fpm-bookworm
            PECL_REDIS_VERSION=6.3.0

      - name: 构建并推送 web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NS }}/${{ env.REPO_WEB }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NS }}/${{ env.REPO_WEB }}:latest
          build-args: |
            NGINX_IMAGE=nginx:1.31.1-alpine

      - name: 输出镜像地址
        run: |
          echo "### 镜像发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "GEOFLOW_APP_IMAGE=${{ env.REGISTRY }}/${{ env.NS }}/${{ env.REPO_APP }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "GEOFLOW_WEB_IMAGE=${{ env.REGISTRY }}/${{ env.NS }}/${{ env.REPO_WEB }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
